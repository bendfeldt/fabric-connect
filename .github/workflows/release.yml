# Releases only when a maintainer asks, without ever pushing to main
# directly, so strict branch protection (require PR + required status
# checks) stays on with no bypass list. Merging to main never releases on
# its own. Two phases:
#
#   1. propose-bump — run manually (Actions -> Release -> Run workflow).
#      Infers the semver bump from conventional commits since the last v*
#      tag (BREAKING CHANGE/"!:" => major, feat => minor, else patch) unless
#      a bump is chosen explicitly, bumps package.json and the lockfile, files
#      the changelog's "Unreleased" entries under the new version
#      (scripts/syncChangelog.cjs) so the repo never has a version without its
#      changelog section, commits all of it on a bot/version-bump branch,
#      opens a PR titled "chore(release): vX.Y.Z" and enables auto-merge by
#      rebase. The PR merges itself once required checks pass.
# 2. publish-release — when the bump PR's rebased commit lands on main: package
#   the .vsix, publish it to the VS Code Marketplace through trusted
#   publishing (see below), publish the GitHub Release, and create the vX.Y.Z
#   tag at that commit. Every other push to main does nothing here.
#
# propose-bump always builds bot/version-bump from the live tip of main and
# computes the bump over the full range since the last tag; running it again
# before the PR merges force-updates the same PR. Runs are serialized by the
# concurrency group (enable "require branches to be up to date" on the
# ruleset so a stale bump PR is never merged).
#
# One-time repo setup required:
#   - RELEASE_PAT secret: fine-grained PAT for this repo with read/write on
#     Contents and Pull requests. The default GITHUB_TOKEN cannot be used for
#     the bump PR: PRs it creates never trigger workflows, so required checks
#     would sit pending forever and auto-merge would never fire.
#   - Settings -> General: "Allow auto-merge" on, rebase merging allowed.
#   - Ruleset on main: require PR, require Build/Test status checks, and no
#     required human approval (the bot cannot approve its own PR; requiring
#     approval means someone must also approve the bump PR).
#
# VS Code Marketplace publishing uses GitHub OIDC trusted publishing with no
# stored Marketplace secret. Before the first release, create this policy at
# marketplace.visualstudio.com/manage -> publisher `bendfeldt` -> Trusted
# Publishing:
# - Policy name: Fabric Connect release
# - Repository owner: bendfeldt
# - Repository: fabric-connect
# - Workflow: release.yml
# - Environment: blank
# If this repository is private, run this workflow within 48 hours after policy
# creation so the first successful token exchange activates it permanently.
# vsce requests a GitHub OIDC token for marketplace.visualstudio.com and
# exchanges it for a short-lived credential scoped to the package.json
# publisher. Marketplace publishing is required and runs before GitHub Release
# creation, so missing policy or failed token exchange leaves no partial GitHub
# Release. Existing releases are intentionally not backfilled.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = infer from commit messages since the last release)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  propose-bump:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require RELEASE_PAT
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::RELEASE_PAT secret is not set. Create a fine-grained PAT" \
              "(Contents + Pull requests: read/write) and add it as a repo secret;" \
              "see the header comment in .github/workflows/release.yml."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main # live tip, not the frozen push SHA — see header comment
          fetch-depth: 0 # full history + tags for bump inference
          token: ${{ secrets.RELEASE_PAT }}

      - name: Determine version bump
        id: bump
        env:
          REQUESTED: ${{ inputs.bump }}
        run: |
          if [ "$REQUESTED" != "auto" ]; then
            echo "Bump chosen when the workflow was started: $REQUESTED"
            echo "bump=$REQUESTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            range="$last_tag..HEAD"
          else
            range="HEAD"
          fi
          subjects="$(git log --format='%s' "$range")"
          bodies="$(git log --format='%b' "$range")"
          if printf '%s\n' "$bodies" | grep -q 'BREAKING CHANGE' \
            || printf '%s\n' "$subjects" | grep -Eq '^[a-z]+(\([^)]*\))?!:'; then
            bump=major
          elif printf '%s\n' "$subjects" | grep -Eq '^feat(\([^)]*\))?:'; then
            bump=minor
          else
            bump=patch
          fi
          echo "Commits since ${last_tag:-start of history}: bump=$bump"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: version
        run: |
          npm version "${{ steps.bump.outputs.bump }}" --no-git-tag-version
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Roll the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/syncChangelog.cjs "$VERSION" "$(date -u +%F)"

      - name: Open version bump PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_PAT }}
          branch: bot/version-bump
          base: main
          commit-message: "chore(release): v${{ steps.version.outputs.version }}"
          title: "chore(release): v${{ steps.version.outputs.version }}"
          body: >
            Automated ${{ steps.bump.outputs.bump }} version bump. Merging this
            PR publishes the v${{ steps.version.outputs.version }} GitHub
            Release with the packaged .vsix. Started manually; running the
            Release workflow again before this merges refreshes it from the
            tip of main.
          delete-branch: true

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh pr merge --auto --rebase '${{ steps.pr.outputs.pull-request-number }}'

  publish-release:
    if: ${{ github.event_name == 'push' && github.event.head_commit != null && startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # GitHub OIDC token for Marketplace trusted publishing
    steps:
      - uses: actions/checkout@v4 # the pushed SHA is the release commit

      - name: Check release completeness
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          asset="fabric-connect-$version.vsix"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          set +e
          release_response="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1)"
          status=$?
          set -e
          disposition="$(printf '%s' "$release_response" | \
            node scripts/releaseState.cjs "$status" "$asset")"

          case "$disposition" in
            complete)
              echo "release_exists=true" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Release v$version already has a complete $asset; nothing to publish."
              ;;
            partial)
              echo "release_exists=true" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Release v$version lacks a complete $asset; repairing it."
              ;;
            absent)
              echo "release_exists=false" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Run tests
        if: steps.guard.outputs.skip != 'true'
        run: npm test

      - name: Package extension
        if: steps.guard.outputs.skip != 'true'
        # vscode:prepublish cleans out/ and recompiles, so no stale build
        # output can ship; .vscodeignore allowlists what goes in.
        run: npm run package

      # Marketplace failures happen before GitHub Release creation. If the
      # final step creates a release but fails to upload its VSIX, a re-run
      # detects the missing asset, skips the duplicate Marketplace version,
      # and repairs the release. A complete release is skipped.
      - name: Publish to VS Code Marketplace (trusted publishing)
        if: steps.guard.outputs.skip != 'true'
        # --oidc exchanges this job's GitHub OIDC token (id-token: write)
        # for a Marketplace credential; the .vsix is the one packaged above,
        # so nothing is rebuilt.
        run: >
          npx --yes @vscode/vsce@4.1.1 publish
          --oidc
          --skip-duplicate
          --packagePath 'fabric-connect-${{ steps.guard.outputs.version }}.vsix'

      - name: Create or repair GitHub Release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ steps.guard.outputs.version }}'
          asset="fabric-connect-$version.vsix"
          if [ '${{ steps.guard.outputs.release_exists }}' = 'true' ]; then
            gh release upload "v$version" "$asset" \
              --clobber
          else
            gh release create "v$version" \
              --target '${{ github.sha }}' \
              --title "v$version" \
              --generate-notes \
              "$asset"
          fi
