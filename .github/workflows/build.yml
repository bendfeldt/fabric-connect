name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabric-connect-build
          path: out/src/
          retention-days: 7

      # The same packaging the Release workflow does, on every PR, so a
      # .vsix that would ship sources, tests, agent tooling or stale build
      # output is caught before merge rather than after a release.
      - name: Package extension
        run: npm run package

      - name: Check packaged contents
        run: |
          unzip -Z1 fabric-connect-*.vsix > vsix-files.txt
          cat vsix-files.txt
          if grep -Ev '^(extension\.vsixmanifest|\[Content_Types\]\.xml|extension/(package\.json|readme\.md|changelog\.md|LICENSE\.txt|media/.*|out/src/.*\.js))$' vsix-files.txt; then
            echo "::error::Unexpected files in the .vsix (see above); fix .vscodeignore."
            exit 1
          fi

      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: fabric-connect-vsix
          path: fabric-connect-*.vsix
          retention-days: 7
