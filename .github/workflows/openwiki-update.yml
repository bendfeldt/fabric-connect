# Keeps the OpenWiki-generated repository wiki (openwiki/) current. Installs
# the openwiki CLI (https://github.com/langchain-ai/openwiki), regenerates the
# wiki non-interactively, and routes the result through a docs PR — never a
# direct push — so strict branch protection on main stays intact.
#
# The first run (manual workflow_dispatch) also creates the initial wiki:
# `openwiki code --update` generates the docs if they don't exist yet, so no
# interactive `--init` is ever needed in CI.
#
# One-time repo setup required:
#   - OPENROUTER_API_KEY secret: OpenRouter key used to run the wiki model.
#     The model is pinned in OPENWIKI_MODEL_ID below; swap it there if needed.
#   - RELEASE_PAT secret: already required by release.yml. Reused here for the
#     docs PR because PRs created with the default GITHUB_TOKEN never trigger
#     workflows, so the required Build/Test checks would sit pending forever.
name: OpenWiki

# Triggers disabled — uncomment to re-enable.
# on:
#   workflow_dispatch:
#   schedule:
#     - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Require secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set. Create an" \
              "OpenRouter API key and add it as a repo secret; see the header" \
              "comment in .github/workflows/openwiki-update.yml."
            exit 1
          fi
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::RELEASE_PAT secret is not set. It is required for" \
              "the docs PR; see the header comment in" \
              ".github/workflows/release.yml."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Update wiki
        env:
          OPENWIKI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: z-ai/glm-5.2
          OPENWIKI_TELEMETRY_DISABLED: "1"
        run: openwiki code --update --print

      # The checkout is clean, so everything in the working tree at this point
      # is exactly what the openwiki CLI wrote (openwiki/ plus agent-context
      # references in AGENTS.md/CLAUDE.md). No add-paths filter: a pathspec
      # for a file the CLI didn't touch would fail git add and kill the run.
      - name: Open docs PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_PAT }}
          branch: openwiki/update
          base: main
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: >
            Automated OpenWiki documentation refresh, generated by
            .github/workflows/openwiki-update.yml. Regenerates the wiki in
            openwiki/ from the current state of the codebase; agent-context
            references in AGENTS.md/CLAUDE.md are updated by the openwiki CLI
            itself when they change.
          delete-branch: true
